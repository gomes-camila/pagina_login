name: Continuous Delivery
on:
  push:
    branches:
      - main

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Simulando continuous delivery
      uses: actions/upload-artifact@v4
      with:
        name: my-artifact
        path: |
          ./projeto